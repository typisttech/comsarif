name: Release Drafter

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

cache-mode: none

jobs:
  release-drafter:
    permissions:
      contents: write
      pull-requests: read
    cache-mode: none
    uses: typisttech/.github/.github/workflows/release-drafter.yml@fff1a4a3c5b3cf1f8618cf68600f0603a8c4236e # v9.5.0
