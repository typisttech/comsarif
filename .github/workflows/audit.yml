name: Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * *'
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  go:
    uses: typisttech/.github/.github/workflows/audit-go.yml@e8fb21eeafb5416e1d47d71d5ac656b61e524af1 # v9.3.0
