name: Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * *'
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  go:
    uses: typisttech/.github/.github/workflows/audit-go.yml@51e7a334c027d04864092d8b5469d1ccc5dcfcb6 # v9.0.1
