version: "2"

linters:
  enable:
    # Default
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # Custom
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    # - canonicalheader # Wait for https://github.com/golangci/golangci-lint/issues/6829
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - depguard
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - gomoddirectives
    - goprintffuncname
    - gosec
    - gosmopolitan
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - loggercheck
    - makezero
    - mirror
    - misspell
    - modernize
    - musttag
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - perfsprint
    - predeclared
    - promlinter
    - reassign
    - recvcheck
    - revive
    - sloglint
    - spancheck
    - tagalign
    - testableexamples
    - thelper
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - wrapcheck

  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

    govet:
      enable-all: true
      disable:
        - fieldalignment

    staticcheck:
      checks:
        - all
        - -ST1000 # at least one file in a package should have a package comment

    # Custom
    cyclop:
      max-complexity: 13

    depguard:
      rules:
        all:
          list-mode: strict
          files:
            - $all
            - "!$test"
          allow:
            - $gostd
            - golang.org/x
            - github.com/owenrumney/go-sarif/v3/pkg/report/v210/sarif
            - github.com/typisttech/comsarif
        test:
          files:
            - $test
          deny:
            - pkg: github.com/stretchr/testify
              desc: Use standard library or 'github.com/google/go-cmp/cmp'

    errorlint:
      errorf: false

    exhaustive:
      default-signifies-exhaustive: true

    gocritic:
      enabled-checks:
        - emptyStringTest
        - preferStringWriter

    gocyclo:
      min-complexity: 13

    godoclint:
      enable:
        - max-len
        - no-unused-link
        - require-stdlib-doclink

    godot:
      scope: toplevel
      capital: true

    gosec:
      excludes:
        - G104 # Handled by errcheck

    iface:
      enable:
        - identical
        - unused
        - opaque
        - unusedmethod

    nolintlint:
      require-specific: true

    revive:
      enable-default-rules: true
      rules:
        - name: exported
          disabled: true

        - name: package-comments
          disabled: true

    wrapcheck:
      extra-ignore-sigs:
        - encoding/json/v2.
        - (*encoding/json/jsontext.Decoder).

  exclusions:
    generated: disable
    warn-unused: true
    rules:
      - path: _test\.go
        linters:
          - goconst
          - gosmopolitan

      - source: "^\\s*defer\\s+"
        linters:
          - errcheck

      - path: cmd/comsarif/(.+)\.go
        linters:
          - wrapcheck

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines

  settings:
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true
    golines:
      max-len: 120
