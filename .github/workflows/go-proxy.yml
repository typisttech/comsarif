name: Go Proxy

on:
  workflow_dispatch:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.sha }}
  cancel-in-progress: true

permissions: {}

cache-mode: none

jobs:
  go:
    cache-mode: none
    uses: typisttech/.github/.github/workflows/go-proxy.yml@d236eb0e3d18c463896e8bc46dc0c172fca71bc5 # v9.3.4
